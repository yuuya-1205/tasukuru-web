name: PR Visual Screenshots

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-screenshots-publisher
  cancel-in-progress: false

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          path: before
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout pull request revision
        uses: actions/checkout@v4
        with:
          path: after
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            before/package-lock.json
            after/package-lock.json

      - name: Install base dependencies
        run: npm ci --prefix before

      - name: Install pull request dependencies
        run: npm ci --prefix after

      - name: Build base revision
        run: npm run build --prefix before

      - name: Build pull request revision
        run: npm run build --prefix after

      - name: Install Chromium
        working-directory: after
        run: npx playwright install --with-deps chromium

      - name: Capture Before and After screenshots
        shell: bash
        run: |
          mkdir -p visual-output

          (
            cd before
            exec ./node_modules/.bin/next start \
              --hostname 127.0.0.1 \
              --port 3100
          ) >before-server.log 2>&1 &
          before_server_pid=$!

          (
            cd after
            exec ./node_modules/.bin/next start \
              --hostname 127.0.0.1 \
              --port 3101
          ) >after-server.log 2>&1 &
          after_server_pid=$!

          cleanup() {
            kill "$before_server_pid" "$after_server_pid" 2>/dev/null || true
            wait "$before_server_pid" "$after_server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_server() {
            local url=$1
            local server_pid=$2
            local log_file=$3

            for _ in {1..240}; do
              if curl --fail --silent --output /dev/null "$url"; then
                return 0
              fi

              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$log_file"
                return 1
              fi

              sleep 0.5
            done

            cat "$log_file"
            return 1
          }

          wait_for_server \
            http://127.0.0.1:3100 \
            "$before_server_pid" \
            before-server.log
          wait_for_server \
            http://127.0.0.1:3101 \
            "$after_server_pid" \
            after-server.log

          (
            cd after
            npx playwright screenshot \
              --browser chromium \
              --full-page \
              --viewport-size "1440,900" \
              --wait-for-timeout 1000 \
              http://127.0.0.1:3100 \
              ../visual-output/before.png
            npx playwright screenshot \
              --browser chromium \
              --full-page \
              --viewport-size "1440,900" \
              --wait-for-timeout 1000 \
              http://127.0.0.1:3101 \
              ../visual-output/after.png
          )

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots-pr-${{ github.event.pull_request.number }}
          path: visual-output/
          retention-days: 30

      - name: Publish screenshots
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: visual-diffs
          publish_dir: visual-output
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Add screenshots to pull request description
        uses: actions/github-script@v7
        env:
          BEFORE_IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/visual-diffs/pr-${{ github.event.pull_request.number }}/before.png?sha=${{ github.event.pull_request.base.sha }}
          AFTER_IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/visual-diffs/pr-${{ github.event.pull_request.number }}/after.png?sha=${{ github.event.pull_request.head.sha }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const startMarker = '<!-- visual-screenshots:start -->'
            const endMarker = '<!-- visual-screenshots:end -->'
            const screenshots = `${startMarker}
            ## Visual screenshots

            <table>
              <thead>
                <tr>
                  <th>Before</th>
                  <th>After</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <img alt="Before screenshot" src="${process.env.BEFORE_IMAGE_URL}" width="700">
                  </td>
                  <td>
                    <img alt="After screenshot" src="${process.env.AFTER_IMAGE_URL}" width="700">
                  </td>
                </tr>
              </tbody>
            </table>

            [Download full-size screenshots](${process.env.ACTIONS_RUN_URL})
            ${endMarker}`

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })
            const currentBody = pullRequest.data.body ?? ''
            const startIndex = currentBody.indexOf(startMarker)
            const endIndex = currentBody.indexOf(endMarker)
            let updatedBody

            if (startIndex >= 0 && endIndex >= startIndex) {
              updatedBody =
                currentBody.slice(0, startIndex) +
                screenshots +
                currentBody.slice(endIndex + endMarker.length)
            } else {
              const separator = currentBody.length > 0 ? '\n\n' : ''
              updatedBody = `${currentBody}${separator}${screenshots}`
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: updatedBody,
            })
